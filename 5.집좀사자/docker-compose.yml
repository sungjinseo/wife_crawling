name: getting-home

x-app: &app
  build: ./app
  image: getting-home-app:latest
  env_file: .env
  environment:
    TZ: Asia/Seoul
    DATA_DIR: /data
    CACHE_DIR: /data/cache
    OUT_DIR: /output
  volumes:
    - ./data:/data
    - ${OUTPUT_PATH:-./output}:/output

services:
  # 서버: 매일 공공데이터 수집 + 사용자별 네이버 파일이 올라오면 그 사용자 브리핑 생성
  #   data/users/<아이디>/naver_YYYY-MM-DD.json → output/users/<아이디>/ (web 이 로그인 사용자 것만 서비스)
  pipeline:
    <<: *app
    command: ["python", "scheduler.py"]
    environment:
      TZ: Asia/Seoul
      DATA_DIR: /data
      CACHE_DIR: /data/cache
      OUT_DIR: /output
      PUBLIC_AT: ${PUBLIC_AT:-06:00}
      CHECK_MIN: ${CHECK_MIN:-10}
      UPLOAD_PORT: 8090
      AUTH_URL: http://getting-home-auth:8080
      OWNER_USER: ${OWNER_USER:-}
    # 휴대폰 업로드 API: https://BRIEFING_HOST/upload-api/naver (POST), /upload-api/status (GET)
    #   로그인 대신 사용자별 업로드 토큰(X-Upload-Token 헤더, 웹 '내 계정'에서 발급)으로 보호
    networks:
      - default
      - traefik-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.getting-home-upload.rule=Host(`${BRIEFING_HOST}`) && PathPrefix(`/upload-api`)
      - traefik.http.routers.getting-home-upload.entrypoints=websecure
      - traefik.http.routers.getting-home-upload.tls.certresolver=myresolver
      - traefik.http.routers.getting-home-upload.middlewares=getting-home-upload-strip
      - traefik.http.middlewares.getting-home-upload-strip.stripprefix.prefixes=/upload-api
      - traefik.http.services.getting-home-upload.loadbalancer.server.port=8090
    restart: unless-stopped

  # 로그인: 로그인 화면(/auth), 세션·업로드 토큰 관리. Traefik 이 브리핑·챗봇 요청마다 로그인 여부를 물어봄(forwardAuth)
  #   계정 만들기: docker compose exec auth python manage.py add <아이디>
  auth:
    build: ./auth
    container_name: getting-home-auth          # Traefik·pipeline 이 이 이름으로 찾음 (공유 네트워크에서 이름이 겹치지 않도록)
    environment:
      TZ: Asia/Seoul
      SESSION_DAYS: ${SESSION_DAYS:-30}
    volumes:
      - auth-store:/auth-data                  # 사용자·세션·토큰 (컨테이너를 다시 만들어도 유지)
    networks:
      - default
      - traefik-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.getting-home-auth.rule=Host(`${BRIEFING_HOST}`) && PathPrefix(`/auth`)
      - traefik.http.routers.getting-home-auth.entrypoints=websecure
      - traefik.http.routers.getting-home-auth.tls.certresolver=myresolver
      - traefik.http.services.getting-home-auth.loadbalancer.server.port=8080
      # 브리핑·챗봇에 붙이는 로그인 확인. 통과하면 X-User-Id 를 원래 요청에 붙임 (사용자가 보낸 같은 헤더는 덮어씀)
      - traefik.http.middlewares.getting-home-login.forwardauth.address=http://getting-home-auth:8080/internal/verify
      - traefik.http.middlewares.getting-home-login.forwardauth.authResponseHeaders=X-User-Id
    restart: unless-stopped

  # 프론트: output/users/<아이디>/ 의 브리핑 HTML 을 8080 으로 서비스, Traefik 이 HTTPS·로그인 확인을 붙여 외부에 공개
  web:
    image: nginx:1.27-alpine
    volumes:
      - ${OUTPUT_PATH:-./output}:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - traefik-proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.getting-home.rule=Host(`${BRIEFING_HOST}`)
      - traefik.http.routers.getting-home.entrypoints=websecure
      - traefik.http.routers.getting-home.tls.certresolver=myresolver
      - traefik.http.routers.getting-home.middlewares=getting-home-login
      - traefik.http.services.getting-home.loadbalancer.server.port=8080
    depends_on:
      - pipeline
      - auth
    restart: unless-stopped

  # 수동 실행용: 공공 수집 / 브리핑 생성 즉시 실행
  #   docker compose --profile tools run --rm collect-public --only facilities
  #   docker compose --profile tools run --rm build
  collect-public:
    <<: *app
    profiles: ["tools"]
    entrypoint: ["python", "collect_public.py"]
    restart: "no"
  build:
    <<: *app
    profiles: ["tools"]
    entrypoint: ["python", "build_briefing.py"]
    restart: "no"

  # ---------------- 챗봇 (선택, profile: chat) ----------------
  # 브리핑 화면 오른쪽 아래 '물어보기'. 화면 상태를 받아 화면과 같은 계산으로 답하고, 뉴스로 원인을 찾음
  #   켜기: .env 에 COMPOSE_PROFILES=chat  (또는 docker compose --profile chat up -d --build)
  #   주소: https://BRIEFING_HOST/chat-api/  (브리핑과 같은 로그인, 사용자별 데이터·대화)
  chat:
    build: ./chat
    profiles: ["chat"]
    environment:
      TZ: Asia/Seoul
      DATA_DIR: /data
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY:-}
      NIM_MODELS: ${NIM_MODELS:-nvidia/nemotron-3-super-120b-a12b,openai/gpt-oss-120b}
      NAVER_APIHUB_KEY_ID: ${NAVER_APIHUB_KEY_ID:-}
      NAVER_APIHUB_KEY: ${NAVER_APIHUB_KEY:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      CHAT_DB: /chat-data/chat.db
      CHAT_KEEP_DAYS: ${CHAT_KEEP_DAYS:-30}
      HISTORY_CHARS: ${HISTORY_CHARS:-6000}
      TOOL_RESULT_CHARS: ${TOOL_RESULT_CHARS:-4000}
    volumes:
      - ./data:/data:ro
      - chat-store:/chat-data           # 대화·요약 저장 (컨테이너를 다시 만들어도 유지)
    networks: [traefik-proxy]
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.getting-home-chat.rule=Host(`${BRIEFING_HOST}`) && PathPrefix(`/chat-api`)
      - traefik.http.routers.getting-home-chat.entrypoints=websecure
      - traefik.http.routers.getting-home-chat.tls.certresolver=myresolver
      - traefik.http.routers.getting-home-chat.middlewares=getting-home-login,getting-home-chat-strip
      - traefik.http.middlewares.getting-home-chat-strip.stripprefix.prefixes=/chat-api
      - traefik.http.services.getting-home-chat.loadbalancer.server.port=8080
    restart: unless-stopped

networks:
  traefik-proxy:
    external: true
volumes:
  chat-store:
  auth-store:

