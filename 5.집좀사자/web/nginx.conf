# 브리핑 정적 파일 서비스 (Traefik 뒤에서 8080 으로 동작, HTTPS 는 Traefik, 로그인은 auth 서비스가 담당)
# Traefik forwardAuth 가 로그인을 확인하고 X-User-Id 헤더를 붙여 줌 → 그 사용자 폴더(output/users/<아이디>)만 보여줌
# (헤더는 Traefik 이 auth 응답 값으로 덮어쓰므로 사용자가 직접 넣어도 무시됨)
map $http_x_user_id $user_root {
    "~^(?<uid>[a-z0-9][a-z0-9_-]{1,31})$"  /usr/share/nginx/html/users/$uid;
    default                                 /usr/share/nginx/html/__없음__;
}

server {
    listen 8080;
    server_name _;
    root $user_root;
    index index.html;
    charset utf-8;

    # 브리핑 HTML 에 데이터가 통째로 들어 있어 큼(약 750KB) → 압축 전송
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json;

    location / {
        try_files $uri $uri/ @empty;
        add_header Cache-Control "no-cache";
    }

    # 아직 브리핑이 없는 사용자: 안내 페이지 (scheduler.py 가 씀)
    location @empty {
        root /usr/share/nginx/html;
        try_files /_empty.html =404;
        add_header Cache-Control "no-cache";
    }

    # 날짜별 지난 브리핑 목록 (내 폴더)
    location /archive/ {
        rewrite ^/archive/(.*)$ /$1 break;
        index __없음__;
        autoindex on;
        autoindex_localtime on;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
    }
}
